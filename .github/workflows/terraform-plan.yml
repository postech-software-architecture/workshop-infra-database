name: Terraform — Plan database

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: Digite PLANEJAR DATABASE PROD para confirmar
        required: true
        type: string

concurrency:
  group: terraform-database-prod
  # Serializa com apply/destroy sem jamais cancelar uma operacao mutavel em curso.
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_cluster_state_bucket: soat-tc3-tfstate-mateus-paz
  BACKEND_BUCKET: soat-tc3-tfstate-mateus-paz
  LOCK_TABLE: soat-tc3-tflock

jobs:
  confirmation:
    name: confirmar operacao
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exigir branch e texto exatos
        shell: bash
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo "::error::Plan real permitido somente a partir da main."; exit 1; }
          [[ "${CONFIRMACAO}" == 'PLANEJAR DATABASE PROD' ]] || { echo "::error::Confirmacao invalida."; exit 1; }

  plan:
    name: plan seguro (prod)
    needs: confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Validar credencial e bootstrap do backend
        shell: bash
        run: bash .github/scripts/preflight-backend.sh
      - name: terraform init
        run: terraform init -input=false -no-color
      - name: Inventariar AWS e comparar com o state
        id: inventory
        shell: bash
        run: bash .github/scripts/inventory-database.sh
      - name: Gerar plan revisavel
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          terraform plan -input=false -no-color -out=plan.bin -detailed-exitcode
          plan_exit=$?
          set -e
          if (( plan_exit == 1 )); then exit 1; fi
          terraform show -no-color plan.bin >plan.txt
          cat plan.txt
      - name: Aplicar gates ao plan
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform show -json plan.bin | jq -e '
            [(.resource_changes // [])[] | select(.mode == "managed") | .type
              | select(. != "aws_db_instance" and . != "aws_db_subnet_group" and . != "aws_security_group")]
            | length == 0
          ' >/dev/null || { echo "::error::Plan viola a fronteira de database."; exit 1; }
          terraform show -json plan.bin | jq -e '
            [.planned_values.root_module.resources[]? | select(.address == "aws_db_instance.postgres")][0] as $rds
            | $rds.values.publicly_accessible == false and $rds.values.storage_encrypted == true
          ' >/dev/null || { echo "::error::O RDS planejado deve ser privado e criptografado."; exit 1; }
          terraform show -json plan.bin | jq -e '
            [.planned_values.root_module.resources[]? | select(.address == "aws_security_group.db")][0] as $sg
            | ($sg.values.ingress | length) == 1
              and ($sg.values.ingress | all(
                ((.cidr_blocks // []) | length) == 0
                and ((.ipv6_cidr_blocks // []) | length) == 0
                and ((.prefix_list_ids // []) | length) == 0
                and ((.security_groups // []) | length) == 1))
          ' >/dev/null || { echo "::error::O SG planejado deve aceitar apenas o SG cliente, sem CIDR."; exit 1; }
      - name: Publicar somente o plan textual sanitizado
        uses: actions/upload-artifact@v4
        with:
          name: database-plan-${{ github.run_id }}
          path: plan.txt
          retention-days: 7
          if-no-files-found: error

name: Terraform — Destroy database

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: Digite DESTRUIR DATABASE ANTES DO CLUSTER
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_cluster_state_bucket: ${{ vars.TFSTATE_BUCKET }}
  TFSTATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
  TFSTATE_LOCK_TABLE: ${{ vars.TFSTATE_LOCK_TABLE }}
  TFSTATE_KEY: database/terraform.tfstate

jobs:
  confirmation:
    name: confirmar destruicao
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exigir branch e texto exatos
        shell: bash
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo "::error::Destroy permitido somente a partir da main."; exit 1; }
          [[ "${CONFIRMACAO}" == 'DESTRUIR DATABASE ANTES DO CLUSTER' ]] || { echo "::error::Confirmacao invalida."; exit 1; }

  destroy:
    name: destroy database (prod)
    needs: confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod
    concurrency:
      group: terraform-database-prod
      cancel-in-progress: false
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Validar credencial e backend preservado
        shell: bash
        run: bash .github/scripts/preflight-backend.sh
      - name: terraform init
        run: |
          terraform init -input=false -no-color \
            -backend-config="bucket=${TFSTATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TFSTATE_LOCK_TABLE}"
      - name: Exigir banco completo na AWS e no state
        shell: bash
        env:
          REQUIRE_MANAGED: "true"
        run: bash .github/scripts/inventory-database.sh
      - name: Planejar destroy e confirmar fronteira
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform plan -destroy -input=false -no-color -out=destroy.bin
          bash .github/scripts/validate-plan.sh destroy.bin destroy
          terraform show -no-color destroy.bin
      - name: Destruir somente o state database
        run: terraform apply -input=false -no-color -auto-approve destroy.bin
      - name: Confirmar backend e lock preservados
        shell: bash
        run: |
          bash .github/scripts/preflight-backend.sh
          echo 'Backend S3 e lock DynamoDB preservados. Destrua o cluster somente depois deste workflow.'

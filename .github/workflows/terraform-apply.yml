name: Terraform — Apply database

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: Digite APLICAR DATABASE PROD para confirmar
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_cluster_state_bucket: ${{ vars.TFSTATE_BUCKET }}
  BACKEND_BUCKET: ${{ vars.TFSTATE_BUCKET }}
  LOCK_TABLE: ${{ vars.TFSTATE_LOCK_TABLE }}

jobs:
  confirmation:
    name: confirmar operacao
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exigir branch e texto exatos
        shell: bash
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo "::error::Apply permitido somente a partir da main."; exit 1; }
          [[ "${CONFIRMACAO}" == 'APLICAR DATABASE PROD' ]] || { echo "::error::Confirmacao invalida."; exit 1; }

  apply:
    name: apply database (prod)
    needs: confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod
    concurrency:
      group: terraform-database-prod
      cancel-in-progress: false
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Validar credencial e bootstrap do backend
        shell: bash
        run: bash .github/scripts/preflight-backend.sh
      - name: terraform init
        run: |
          terraform init -input=false -no-color \
            -backend-config="bucket=${BACKEND_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${LOCK_TABLE}"
      - name: Inventariar AWS e comparar com o state
        shell: bash
        run: bash .github/scripts/inventory-database.sh
      - name: Planejar sem destruicao implicita
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform plan -input=false -no-color -out=apply.bin
          bash .github/scripts/validate-plan.sh apply.bin apply
          terraform show -no-color apply.bin
      - name: terraform apply
        run: terraform apply -input=false -no-color -auto-approve apply.bin
      - name: Validar invariantes na AWS
        shell: bash
        run: bash .github/scripts/validate-aws-database.sh
      - name: Gerar contrato sanitizado
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p contracts
          terraform output -json | jq 'with_entries(select(.value.sensitive == false))' >contracts/outputs.json
      - name: Publicar contrato sanitizado
        uses: actions/upload-artifact@v4
        with:
          name: database-outputs-${{ github.run_id }}
          path: contracts/outputs.json
          retention-days: 7
          if-no-files-found: error

name: Terraform — Apply database

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: Digite APLICAR DATABASE PROD para confirmar
        required: true
        type: string

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_cluster_state_bucket: soat-tc3-tfstate-mateus-paz
  BACKEND_BUCKET: soat-tc3-tfstate-mateus-paz
  LOCK_TABLE: soat-tc3-tflock

jobs:
  confirmation:
    name: confirmar operacao
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exigir branch e texto exatos
        shell: bash
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo "::error::Apply permitido somente a partir da main."; exit 1; }
          [[ "${CONFIRMACAO}" == 'APLICAR DATABASE PROD' ]] || { echo "::error::Confirmacao invalida."; exit 1; }

  apply:
    name: apply database (prod)
    needs: confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod
    concurrency:
      group: terraform-database-prod
      cancel-in-progress: false
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Validar credencial e bootstrap do backend
        shell: bash
        run: bash .github/scripts/preflight-backend.sh
      - name: terraform init
        run: terraform init -input=false -no-color
      - name: Inventariar AWS e comparar com o state
        shell: bash
        run: bash .github/scripts/inventory-database.sh
      - name: Planejar sem destruicao implicita
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform plan -input=false -no-color -out=apply.bin
          destructive_count="$(terraform show -json apply.bin | jq '[.resource_changes[]? | select(.mode == "managed") | select((.change.actions | index("delete")) != null)] | length')"
          [[ "$destructive_count" == '0' ]] || { echo "::error::Apply bloqueado: o plan contem destroy ou replacement."; exit 1; }
          terraform show -json apply.bin | jq -e '
            [(.resource_changes // [])[] | select(.mode == "managed") | .type
              | select(. != "aws_db_instance" and . != "aws_db_subnet_group" and . != "aws_security_group")]
            | length == 0
          ' >/dev/null || { echo "::error::Plan viola a fronteira de database."; exit 1; }
          terraform show -json apply.bin | jq -e '
            [.planned_values.root_module.resources[]? | select(.address == "aws_db_instance.postgres")][0] as $rds
            | $rds.values.publicly_accessible == false and $rds.values.storage_encrypted == true
          ' >/dev/null || { echo "::error::RDS deve ser privado e criptografado."; exit 1; }
          terraform show -json apply.bin | jq -e '
            [.planned_values.root_module.resources[]? | select(.address == "aws_security_group.db")][0] as $sg
            | ($sg.values.ingress | length) == 1
              and ($sg.values.ingress | all(
                ((.cidr_blocks // []) | length) == 0
                and ((.ipv6_cidr_blocks // []) | length) == 0
                and ((.prefix_list_ids // []) | length) == 0
                and ((.security_groups // []) | length) == 1))
          ' >/dev/null || { echo "::error::SG deve usar somente o SG cliente, sem CIDR."; exit 1; }
          terraform show -no-color apply.bin
      - name: terraform apply
        run: terraform apply -input=false -no-color -auto-approve apply.bin
      - name: Validar invariantes na AWS
        shell: bash
        run: |
          set -Eeuo pipefail
          aws rds wait db-instance-available --db-instance-identifier workshop-db
          read -r is_public is_encrypted < <(aws rds describe-db-instances \
            --db-instance-identifier workshop-db \
            --query 'DBInstances[0].[PubliclyAccessible,StorageEncrypted]' --output text)
          [[ "$is_public" == 'False' && "$is_encrypted" == 'True' ]] || { echo "::error::RDS criado fora das invariantes de seguranca."; exit 1; }
          echo 'RDS validado: privado e criptografado.'
      - name: Gerar contrato sanitizado
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p contracts
          terraform output -json | jq 'with_entries(select(.value.sensitive == false))' >contracts/outputs.json
      - name: Publicar contrato sanitizado
        uses: actions/upload-artifact@v4
        with:
          name: database-outputs-${{ github.run_id }}
          path: contracts/outputs.json
          retention-days: 7
          if-no-files-found: error

name: Terraform — Apply database

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: Digite APLICAR DATABASE PROD para confirmar
        required: true
        type: string

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_cluster_state_bucket: soat-tc3-tfstate-mateus-paz

jobs:
  confirmation:
    name: confirmar operacao
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exigir branch e texto exatos
        shell: bash
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo "::error::Apply permitido somente a partir da main."; exit 1; }
          [[ "${CONFIRMACAO}" == 'APLICAR DATABASE PROD' ]] || { echo "::error::Confirmacao invalida."; exit 1; }

  apply:
    name: apply database (prod)
    needs: confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod
    concurrency:
      group: terraform-database-prod
      cancel-in-progress: false
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Validar credencial e bootstrap do backend
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::add-mask::${TF_VAR_db_password}"
          aws sts get-caller-identity --query Account --output text >/dev/null
          aws s3api head-bucket --bucket soat-tc3-tfstate-mateus-paz
          aws dynamodb describe-table --table-name soat-tc3-tflock --query 'Table.TableStatus' --output text | grep -qx ACTIVE
      - name: terraform init
        run: terraform init -input=false -no-color
      - name: Inventariar AWS e comparar com o state
        shell: bash
        run: |
          set -Eeuo pipefail
          state_list="${RUNNER_TEMP}/database-state-list.txt"
          state_error="${RUNNER_TEMP}/database-state-error.txt"
          if ! terraform state list >"$state_list" 2>"$state_error"; then
            if grep -q 'No state file was found' "$state_error"; then
              : >"$state_list"
            else
              echo "::error::Falha ao ler o state remoto de database."
              exit 1
            fi
          fi
          state_db=0; grep -Fxq 'aws_db_instance.postgres' "$state_list" && state_db=1
          state_subnets=0; grep -Fxq 'aws_db_subnet_group.this' "$state_list" && state_subnets=1
          state_sg=0; grep -Fxq 'aws_security_group.db' "$state_list" && state_sg=1

          error_file="${RUNNER_TEMP}/aws-inventory-error.txt"
          if aws rds describe-db-instances --db-instance-identifier workshop-db >/dev/null 2>"$error_file"; then aws_db=1
          elif grep -q 'DBInstanceNotFound' "$error_file"; then aws_db=0
          else echo "::error::Falha ao inventariar a instancia RDS."; exit 1; fi
          if aws rds describe-db-subnet-groups --db-subnet-group-name workshop-db-subnets >/dev/null 2>"$error_file"; then aws_subnets=1
          elif grep -q 'DBSubnetGroupNotFound' "$error_file"; then aws_subnets=0
          else echo "::error::Falha ao inventariar o DB subnet group."; exit 1; fi

          expected_vpc_id="$(printf 'local.vpc_id\n' | terraform console -no-color | tail -n 1 | tr -d '"\r')"
          [[ "$expected_vpc_id" =~ ^vpc-[0-9a-f]+$ ]] || { echo "::error::Contrato do cluster nao forneceu VPC valida."; exit 1; }
          sg_count="$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=${expected_vpc_id}" 'Name=group-name,Values=workshop-db-sg' 'Name=tag:Project,Values=workshop' \
            --query 'length(SecurityGroups)' --output text)"
          [[ "$sg_count" =~ ^[0-9]+$ ]] && (( sg_count <= 1 )) || { echo "::error::Inventario inconsistente do SG."; exit 1; }
          aws_sg=0; (( sg_count == 1 )) && aws_sg=1

          aws_signature="${aws_db}${aws_subnets}${aws_sg}"
          state_signature="${state_db}${state_subnets}${state_sg}"
          if [[ "$aws_signature" == '000' && "$state_signature" == '000' ]]; then
            echo 'Inventario CREATE confirmado.'
          elif [[ "$aws_signature" == '111' && "$state_signature" == '111' ]]; then
            echo 'Inventario MANAGED confirmado.'
          else
            echo "::error::AWS e state divergem ou a topologia esta parcial. Importe/reconcilie antes do apply."
            exit 1
          fi
      - name: Planejar sem destruicao implicita
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform plan -input=false -no-color -out=apply.bin
          destructive_count="$(terraform show -json apply.bin | jq '[.resource_changes[]? | select(.mode == "managed") | select((.change.actions | index("delete")) != null)] | length')"
          [[ "$destructive_count" == '0' ]] || { echo "::error::Apply bloqueado: o plan contem destroy ou replacement."; exit 1; }
          terraform show -json apply.bin | jq -e '
            [(.resource_changes // [])[] | select(.mode == "managed") | .type
              | select(. != "aws_db_instance" and . != "aws_db_subnet_group" and . != "aws_security_group")]
            | length == 0
          ' >/dev/null || { echo "::error::Plan viola a fronteira de database."; exit 1; }
          terraform show -json apply.bin | jq -e '
            [.planned_values.root_module.resources[]? | select(.address == "aws_db_instance.postgres")][0] as $rds
            | $rds.values.publicly_accessible == false and $rds.values.storage_encrypted == true
          ' >/dev/null || { echo "::error::RDS deve ser privado e criptografado."; exit 1; }
          terraform show -json apply.bin | jq -e '
            [.planned_values.root_module.resources[]? | select(.address == "aws_security_group.db")][0] as $sg
            | ($sg.values.ingress | length) == 1
              and ($sg.values.ingress | all(
                ((.cidr_blocks // []) | length) == 0
                and ((.ipv6_cidr_blocks // []) | length) == 0
                and ((.prefix_list_ids // []) | length) == 0
                and ((.security_groups // []) | length) == 1))
          ' >/dev/null || { echo "::error::SG deve usar somente o SG cliente, sem CIDR."; exit 1; }
          terraform show -no-color apply.bin
      - name: terraform apply
        run: terraform apply -input=false -no-color -auto-approve apply.bin
      - name: Validar invariantes na AWS
        shell: bash
        run: |
          set -Eeuo pipefail
          aws rds wait db-instance-available --db-instance-identifier workshop-db
          read -r is_public is_encrypted < <(aws rds describe-db-instances \
            --db-instance-identifier workshop-db \
            --query 'DBInstances[0].[PubliclyAccessible,StorageEncrypted]' --output text)
          [[ "$is_public" == 'False' && "$is_encrypted" == 'True' ]] || { echo "::error::RDS criado fora das invariantes de seguranca."; exit 1; }
          echo 'RDS validado: privado e criptografado.'
      - name: Gerar contrato sanitizado
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p contracts
          terraform output -json | jq 'with_entries(select(.value.sensitive == false))' >contracts/outputs.json
      - name: Publicar contrato sanitizado
        uses: actions/upload-artifact@v4
        with:
          name: database-outputs-${{ github.run_id }}
          path: contracts/outputs.json
          retention-days: 7
          if-no-files-found: error

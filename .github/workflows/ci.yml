name: CI — Terraform (database)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: database-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: fmt, validate e tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform init (sem backend)
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate -no-color
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          # O Academy permite concessoes documentadas; as invariantes da W3
          # permanecem bloqueantes no job abaixo.
          soft_fail: true

  database-policy:
    name: fronteira e seguranca do banco
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bloquear recursos fora do state de database
        shell: bash
        run: |
          set -Eeuo pipefail
          forbidden='resource[[:space:]]+"(aws_eks_|aws_vpc"|aws_subnet"|aws_nat_gateway"|aws_internet_gateway"|aws_route_table"|aws_lb")'
          if grep -RInE --include='*.tf' "$forbidden" .; then
            echo "::error::O state database nao pode gerenciar VPC, subnets, EKS ou load balancer."
            exit 1
          fi
      - name: Exigir RDS privado e criptografado
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -R -qE --include='*.tf' --exclude-dir=.terraform 'publicly_accessible[[:space:]]*=[[:space:]]*false' . || {
            echo "::error::publicly_accessible=false e obrigatorio."
            exit 1
          }
          grep -R -qE --include='*.tf' --exclude-dir=.terraform 'storage_encrypted[[:space:]]*=[[:space:]]*true' . || {
            echo "::error::storage_encrypted=true e obrigatorio."
            exit 1
          }
          if grep -R -nE --include='*.tf' --exclude-dir=.terraform '(^|[[:space:]])(cidr_blocks|ipv6_cidr_blocks)[[:space:]]*=' .; then
            echo "::error::O SG do banco nao aceita ingress por CIDR."
            exit 1
          fi
          grep -R -qE --include='*.tf' --exclude-dir=.terraform 'security_groups[[:space:]]*=[[:space:]]*\[local\.db_client_sg_id\]' . || {
            echo "::error::O ingress deve usar exclusivamente db_client_sg_id."
            exit 1
          }
